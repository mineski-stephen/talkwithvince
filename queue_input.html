<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vince — Queue Control</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #1e1e1e;
      color: #ffffff;
    }
    body {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px;
      box-sizing: border-box;
    }
    h1 { font-size: 1.6em; margin: 8px 0 16px; text-align: center; }
    h2 { font-size: 1.2em; margin: 24px 0 8px; }

    .add-row { display: flex; gap: 8px; }
    .add-row input {
      flex: 1;
      padding: 14px;
      font-size: 1.1em;
      border: 1px solid #555;
      border-radius: 8px;
      background-color: #333;
      color: #fff;
    }
    button {
      padding: 12px 16px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .btn-add   { background-color: #4CAF50; font-size: 1.2em; }
    .btn-call  { background-color: #2e7dd6; }
    .btn-back  { background-color: #777; }
    .btn-done  { background-color: #4CAF50; }
    .btn-del   { background-color: #b3261e; }
    .btn-clear { background-color: #b3261e; width: 100%; margin-top: 8px; }

    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      margin-bottom: 8px;
      background-color: #2c2c2c;
      border-radius: 10px;
      transition: transform 0.15s ease;
    }
    li .name { flex: 1; font-size: 1.2em; word-break: break-word; }
    li.empty { background: transparent; color: #888; font-style: italic; justify-content: center; }

    /* Drag-to-reorder (queue list only) */
    .drag-handle {
      cursor: grab;
      touch-action: none;        /* the handle drags; it never scrolls the page */
      user-select: none;
      -webkit-user-select: none;
      color: #888;
      font-size: 1.3em;
      padding: 8px 6px 8px 0;
    }
    li.drag-placeholder { opacity: 0.35; }
    li.drag-clone {
      position: fixed;
      margin: 0;
      z-index: 1000;
      pointer-events: none;
      transition: none;          /* must track the cursor instantly */
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }

    #status {
      min-height: 1.2em;
      margin: 10px 0;
      color: #ff8a80;
      font-size: 0.95em;
      text-align: center;
    }
    .col-head { display: flex; justify-content: space-between; align-items: baseline; }
    .count { color: #888; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>Talk With Vince — Queue Control</h1>

  <div class="add-row">
    <input type="text" id="nameInput" placeholder="Enter customer name" autocomplete="off" />
    <button class="btn-add" id="addBtn">Add</button>
  </div>

  <div id="status"></div>

  <div class="col-head"><h2>In Queue</h2><span class="count" id="queueCount"></span></div>
  <ul id="queueList"></ul>

  <div class="col-head"><h2>Now Serving</h2><span class="count" id="servingCount"></span></div>
  <ul id="servingList"></ul>

  <button class="btn-clear" id="clearBtn">Clear all served</button>

  <audio id="bellSound" src="bell.mp3" preload="auto"></audio>

  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script>
    const nameInput = document.getElementById("nameInput");
    const addBtn = document.getElementById("addBtn");
    const clearBtn = document.getElementById("clearBtn");
    const queueList = document.getElementById("queueList");
    const servingList = document.getElementById("servingList");
    const queueCount = document.getElementById("queueCount");
    const servingCount = document.getElementById("servingCount");
    const statusEl = document.getElementById("status");
    const bellSound = document.getElementById("bellSound");

    let writing = false;     // a write is in flight — pause polling, ignore extra clicks
    let dragging = false;    // a card is being dragged — pause polling, ignore other drags
    let lastSig = null;       // skip re-render when nothing changed
    let knownServing = new Set();  // ids currently in NOW SERVING (drives the bell)
    let bellPrimed = false;        // skip the bell on the very first load
    const RECONNECTING = "⚠ Reconnecting…";

    function setStatus(msg) { statusEl.textContent = msg || ""; }

    function friendlyError(e) {
      const m = String(e && e.message || e);
      if (m.includes("401") || m.includes("403")) {
        return "Write blocked by Supabase. Run the RLS policy SQL (see setup notes), then retry.";
      }
      return "Something went wrong: " + m;
    }

    // Wrap any write so clicks don't overlap and errors are surfaced.
    async function doWrite(fn) {
      if (writing) return;
      writing = true;
      setStatus("");
      try {
        await fn();
        await refresh(true);          // pull the truth back immediately
      } catch (e) {
        setStatus(friendlyError(e));
      } finally {
        writing = false;
      }
    }

    function makeButton(label, cls, handler) {
      const b = document.createElement("button");
      b.textContent = label;
      b.className = cls;
      b.addEventListener("click", handler);
      return b;
    }

    // Drag a queue card to a new position. A fixed-position clone follows the
    // pointer; the real card stays in the DOM (dimmed) and neighbours slide
    // aside with CSS transforms. Keeping the DOM untouched during the drag
    // means pointer capture is never lost mid-drag (moving the captured
    // element would release it, which breaks touch dragging).
    function startDrag(e, li, rows, index) {
      if (dragging || writing || rows.length < 2) return;
      if (e.pointerType === "mouse" && e.button !== 0) return;
      e.preventDefault();
      dragging = true;

      const handle = e.currentTarget;
      try { handle.setPointerCapture(e.pointerId); } catch (_) {}

      const items = [...queueList.children];
      const rect = li.getBoundingClientRect();
      const grabX = e.clientX - rect.left;
      const grabY = e.clientY - rect.top;
      const step = rect.height + 8;   // row height + the 8px row gap
      // Row midpoints in their resting positions — drop targets are computed
      // against these, not the transformed positions, so the math stays stable.
      const mids = items.map(el => {
        const r = el.getBoundingClientRect();
        return r.top + r.height / 2;
      });

      const clone = li.cloneNode(true);
      clone.classList.add("drag-clone");
      clone.style.width = rect.width + "px";
      clone.style.left = rect.left + "px";
      clone.style.top = rect.top + "px";
      document.body.appendChild(clone);
      li.classList.add("drag-placeholder");
      document.body.style.cursor = "grabbing";

      let to = index;

      const onMove = (ev) => {
        if (ev.pointerId !== e.pointerId) return;
        clone.style.left = (ev.clientX - grabX) + "px";
        clone.style.top = (ev.clientY - grabY) + "px";
        let shiftedDown = 0, shiftedUp = 0;
        items.forEach((el, k) => {
          if (k === index) return;
          if (k < index && ev.clientY < mids[k]) {
            el.style.transform = `translateY(${step}px)`;
            shiftedDown++;
          } else if (k > index && ev.clientY > mids[k]) {
            el.style.transform = `translateY(${-step}px)`;
            shiftedUp++;
          } else {
            el.style.transform = "";
          }
        });
        to = index - shiftedDown + shiftedUp;
      };

      const finish = (commit) => {
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onCancel);
        items.forEach(el => { el.style.transform = ""; });
        clone.remove();
        li.classList.remove("drag-placeholder");
        document.body.style.cursor = "";
        dragging = false;
        if (commit && to !== index) {
          doWrite(() => reorderNames(rows, index, to));
        }
      };
      const onUp = (ev) => { if (ev.pointerId === e.pointerId) finish(true); };
      const onCancel = (ev) => { if (ev.pointerId === e.pointerId) finish(false); };

      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      window.addEventListener("pointercancel", onCancel);
    }

    function renderList(ul, rows, kind) {
      ul.innerHTML = "";
      if (rows.length === 0) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = kind === "serving" ? "No one being served" : "No one in queue";
        ul.appendChild(li);
        return;
      }
      rows.forEach((r, i) => {
        const li = document.createElement("li");

        if (kind === "queue") {
          const handle = document.createElement("span");
          handle.className = "drag-handle";
          handle.textContent = "⠿";
          handle.title = "Drag to reorder";
          handle.addEventListener("pointerdown", (e) => startDrag(e, li, rows, i));
          li.appendChild(handle);
        }

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = r.name;
        li.appendChild(name);

        if (kind === "queue") {
          li.appendChild(makeButton("Call ▶", "btn-call", () => doWrite(() => setServing(r.id, 1))));
          li.appendChild(makeButton("✕", "btn-del", () => doWrite(() => removeRow(r.id))));
        } else {
          li.appendChild(makeButton("◀ Back", "btn-back", () => doWrite(() => setServing(r.id, 0))));
          li.appendChild(makeButton("Done ✓", "btn-done", () => doWrite(() => removeRow(r.id))));
        }
        ul.appendChild(li);
      });
    }

    // Fetch + render. force=true bypasses the unchanged-data short-circuit.
    async function refresh(force) {
      const rows = await fetchRows();
      const sig = rows.map(r => `${r.id}:${r.serving}:${r.name}`).join("|");
      if (!force && sig === lastSig) return;
      lastSig = sig;
      const queue = rows.filter(r => !r.serving);   // serving=false -> in queue
      const serving = rows.filter(r => r.serving);   // serving=true  -> now serving

      // Ring when someone newly enters NOW SERVING — whether called from this
      // device or another one. Same logic as the display page.
      const nowIds = new Set(serving.map(r => r.id));
      if (bellPrimed) {
        for (const id of nowIds) {
          if (!knownServing.has(id)) {
            bellSound.currentTime = 0;
            bellSound.play().catch(() => {});  // blocked until the first tap on the page
            break;
          }
        }
      }
      bellPrimed = true;
      knownServing = nowIds;

      queueCount.textContent = queue.length ? `(${queue.length})` : "";
      servingCount.textContent = serving.length ? `(${serving.length})` : "";
      renderList(queueList, queue, "queue");
      renderList(servingList, serving, "serving");
    }

    function addFromInput() {
      const name = nameInput.value.trim();
      if (!name) return;
      doWrite(async () => { await addCustomer(name); nameInput.value = ""; nameInput.focus(); });
    }

    // Browsers block audio until the user interacts with the page. The
    // operator always taps something (input, Call, a drag handle), so unlock
    // on the first tap — no "tap to enable sound" overlay needed here.
    document.addEventListener("pointerdown", () => {
      bellSound.play().then(() => {
        bellSound.pause();
        bellSound.currentTime = 0;
      }).catch(() => {});
    }, { once: true });

    addBtn.addEventListener("click", addFromInput);
    nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addFromInput(); });

    clearBtn.addEventListener("click", () => {
      if (confirm("Remove everyone currently being served?")) {
        doWrite(() => clearServed());
      }
    });

    // Background poll so two operators stay in sync. Skip while a write is in flight.
    async function poll() {
      if (writing || dragging) return;
      try {
        await refresh(false);
        // only clear our own transient banner — never clobber a write-error message
        if (statusEl.textContent === RECONNECTING) setStatus("");
      } catch (e) {
        setStatus(RECONNECTING);
      }
    }
    setInterval(poll, POLL_INTERVAL_MS);
    poll();
  </script>
</body>
</html>
